<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f8ff;
    }

    h1 {
      color: #333;
    }

    label {
      font-weight: bold;
    }

    input[type="text"] {
      padding: 5px;
      margin: 10px 0;
      width: 200px;
    }

    button {
      padding: 5px 10px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #333;
    }

    div {
      margin: 10px 0;
    }

    span {
      display: inline-block;
      min-width: 100px;
    }

    #map {
      height: 400px;
      width: 100%;
    }

    #windArrow {
      font-size: 35px;
      transform-origin: center;
      width: 50px;
      height: 50px;
      text-align: center;
      vertical-align: middle;
      display: inline-block;
    }
  </style>
</head>

<body>
  <h1>Welcome to the Weather App</h1>
  <label for="location">Enter location:</label>
  <input type="text" id="location" name="location">
  <button id="getWeatherButton" onclick="getLocationWeather()">Get Weather</button>
  <div id="weatherAndMap" style="display: none;">
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
      <div style="flex: 1;">
        <label for="latitude">Latitude:</label><br>
        <span id="latitude"></span>
      </div>
      <div style="flex: 1;">
        <label for="longitude">Longitude:</label><br>
        <span id="longitude"></span>
      </div>
      <div style="flex: 1;">
        <label for="weatherDescription">Weather Description:</label><br>
        <span id="weatherDescription"></span>
      </div>
      <div style="flex: 1;">
        <label for="temperature">Temperature:</label><br>
        <span id="temperature"></span>
      </div>
      <div style="flex: 1;">
        <label for="windSpeed">Wind Speed:</label><br>
        <span id="windSpeed"></span>
      </div>
      <div style="flex: 1;">
        <label for="windDirection">Wind Direction:</label><br>
        <span id="windDirection"></span><br>
      </div>
      <div style="flex: 1;">
        <span id="windArrow">&#8593;</span>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <script src="index.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    let map;

    function getValue(weather, key) {
      const weatherValue = weather.current_weather[key];
      const weatherUnit = weather.current_weather_units[key];
      return weatherValue.toString().concat(weatherUnit);
    }

    async function getLocationWeather() {
      document.getElementById('getWeatherButton').disabled = true;
      document.getElementById('weatherAndMap').style.display = 'none';
      const location = document.getElementById('location').value;
      const weather = await getWeather(location);
      document.getElementById('weatherAndMap').style.display = 'block';

      const { latitude, longitude, weatherDescription } = weather;
      document.getElementById('latitude').textContent = latitude;
      document.getElementById('longitude').textContent = longitude;
      document.getElementById('weatherDescription').textContent = weatherDescription;

      document.getElementById('temperature').textContent = getValue(weather, 'temperature');
      document.getElementById('windSpeed').textContent = getValue(weather, 'windspeed');
      document.getElementById('windDirection').textContent = getValue(weather, 'winddirection');

      const direction = weather.current_weather.winddirection;
      const windArrow = document.getElementById('windArrow');
      windArrow.style.transform = `rotate(${direction + 180}deg)`;

      if (map) {
        map.remove(); // Remove the existing map instance
      }

      map = L.map('map').setView([latitude, longitude], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      L.marker([latitude, longitude]).addTo(map)
        .bindPopup('Location: ' + location + '; ' + latitude + ', ' + longitude)
        .openPopup();
      document.getElementById('getWeatherButton').disabled = false;
    }
  </script>
</body>

</html>
